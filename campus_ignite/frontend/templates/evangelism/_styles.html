<style>
.kb-eyebrow{color:var(--ci-accent);font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;margin:0 0 .25rem;}
.kb-donut{--p:0%;width:160px;height:160px;border-radius:50%;margin:1rem auto 0;position:relative;display:grid;place-items:center;background:conic-gradient(var(--ci-accent) var(--p),#e4e9f2 0);}
.kb-donut::before{content:"";position:absolute;width:128px;height:128px;border-radius:50%;background:#fff;}
.kb-donut>div{position:relative;text-align:center;line-height:1.2;}
.kb-prize{background:#fff7e9;border:1px solid #f5d491;color:#765013;font-weight:700;border-radius:10px;padding:.8rem 1rem;margin-bottom:1rem;}
.kb-row{display:grid;grid-template-columns:30px 44px 1fr minmax(90px,28%);align-items:center;gap:12px;padding:.8rem 0;border-top:1px solid #e4e9f2;}
.kb-row:first-child{border-top:0;}
.kb-rank{color:var(--ci-primary);font-size:1.05rem;font-weight:800;}
.kb-logo{width:42px;height:42px;border-radius:12px;overflow:hidden;background:var(--ci-light);display:grid;place-items:center;font-weight:800;color:var(--ci-primary);}
.kb-logo img{width:100%;height:100%;object-fit:cover;}
.kb-bar small{display:block;text-align:right;margin-top:4px;color:#687693;font-weight:700;}
.kb-progress{height:8px;background:#e4e9f2;border-radius:99px;overflow:hidden;}
.kb-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--ci-primary),var(--ci-accent));border-radius:inherit;}
.kb-score{display:grid;grid-template-columns:30px 40px 1fr auto;align-items:center;gap:12px;padding:.7rem 0;border-top:1px solid #e4e9f2;}
.kb-score:first-child{border-top:0;}
.kb-metric{padding:.9rem 0;border-top:1px solid #e4e9f2;}
.kb-metric:first-child{border-top:0;}
.kb-metric-top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:.4rem;color:var(--ci-primary);}
@media(max-width:480px){.kb-row{grid-template-columns:24px 38px 1fr 80px;gap:8px;}}
</style>
