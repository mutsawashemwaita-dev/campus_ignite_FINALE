{% extends 'base.html' %}
{% block title %}Add Student Anchor{% endblock %}
{% block page_title %}Add Student Anchor{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="ci-form-card">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Username <span class="text-danger">*</span></label>
          <input type="text" name="username" class="form-control" placeholder="Type the username of an existing user">
          {% if form.username.errors %}<div class="text-danger small mt-1">{{ form.username.errors.0 }}</div>{% endif %}
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-ci px-4">Save</button>
          <a href="{% url 'student_anchor_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
