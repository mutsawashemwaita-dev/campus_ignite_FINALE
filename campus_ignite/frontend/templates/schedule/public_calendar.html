{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Ignite — What's On</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="{% static 'css/campus_ignite.css' %}" rel="stylesheet">
</head>
<body style="background:#f4f6fb;">

<div style="background:var(--ci-primary);padding:1.5rem 1rem;text-align:center;">
  <img src="{% static 'img/logo.png.jpeg' %}" style="width:56px;height:56px;object-fit:contain;border-radius:50%;margin-bottom:.5rem;">
  <h4 style="color:#fff;font-weight:700;margin:0;">Campus Ignite — What's On</h4>
  <p style="color:rgba(255,255,255,.65);font-size:.85rem;margin:.25rem 0 0;">Cells, Departments & Services — no login needed</p>
</div>

<div class="container py-4">
  <div class="d-flex flex-wrap gap-3 align-items-center mb-3">
    {% for item in legend %}
    <span class="small text-muted">
      <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:{{ item.color }};margin-right:5px;"></span>{{ item.label }}
    </span>
    {% endfor %}
  </div>

  <div class="d-flex flex-wrap gap-3 mb-3">
    <div class="form-check form-check-inline">
      <input class="form-check-input filter-check" type="checkbox" value="cell" id="filterCell" checked>
      <label class="form-check-label small" for="filterCell">Cells</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input filter-check" type="checkbox" value="department" id="filterDept" checked>
      <label class="form-check-label small" for="filterDept">Departments</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input filter-check" type="checkbox" value="service" id="filterService" checked>
      <label class="form-check-label small" for="filterService">Services</label>
    </div>
  </div>

  <div class="ci-card card p-3">
    <div id="orgCalendar"></div>
  </div>

  <div id="eventDetailModal" class="modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title" id="eventDetailTitle"></h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="small text-muted mb-1" id="eventDetailMeta"></p>
          <p class="mb-0" id="eventDetailDesc"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <p class="text-center text-muted small mt-4">
    <i class="fas fa-lock me-1"></i>Leaders: <a href="{% url 'login' %}">log in</a> to manage events.
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const calendarEl = document.getElementById('orgCalendar');
  const checks = document.querySelectorAll('.filter-check');

  function activeTypes() {
    return Array.from(checks).filter(c => c.checked).map(c => c.value);
  }

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'multiMonthYear',
    initialDate: '{{ year }}-01-01',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'multiMonthYear,dayGridMonth,listMonth'
    },
    height: 'auto',
    events: function (info, successCallback, failureCallback) {
      const params = new URLSearchParams({
        start: info.startStr,
        end: info.endStr,
        types: activeTypes().join(',')
      });
      fetch("{% url 'public_calendar_events' %}?" + params.toString())
        .then(r => r.json())
        .then(data => successCallback(data))
        .catch(err => failureCallback(err));
    },
    eventClick: function (info) {
      info.jsEvent.preventDefault();
      const props = info.event.extendedProps;
      document.getElementById('eventDetailTitle').textContent = info.event.title;
      document.getElementById('eventDetailMeta').textContent =
        props.type + (props.time ? ' • ' + props.time : '') + ' • ' + info.event.startStr;
      document.getElementById('eventDetailDesc').textContent = props.description || 'No further details.';
      const modal = new bootstrap.Modal(document.getElementById('eventDetailModal'));
      modal.show();
    }
  });

  calendar.render();
  checks.forEach(c => c.addEventListener('change', () => calendar.refetchEvents()));

  function scrollToToday(attempts) {
    attempts = attempts || 0;
    const todayCell = calendarEl.querySelector('.fc-day-today');
    if (todayCell) {
      todayCell.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else if (attempts < 10) {
      setTimeout(() => scrollToToday(attempts + 1), 100);
    }
  }
  const todayBtn = document.querySelector('.fc-today-button');
  if (todayBtn) {
    todayBtn.addEventListener('click', function () { setTimeout(() => scrollToToday(), 100); });
  }
  scrollToToday();
});
</script>
</body>
</html>
